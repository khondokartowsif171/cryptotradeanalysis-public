server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location = /mcp {
        proxy_pass https://cryptox-api.auraajenticai.cloud/connector;
        include /etc/nginx/cryptox-proxy.conf;
    }
    location ^~ /mcp/ {
        proxy_pass https://cryptox-api.auraajenticai.cloud/connector/;
        include /etc/nginx/cryptox-proxy.conf;
    }
    location ^~ /api/mcp { return 404; }
    location ^~ /api/connector { return 404; }
    location /api/ {
        proxy_pass https://cryptox-api.auraajenticai.cloud/;
        include /etc/nginx/cryptox-proxy.conf;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
